
name: Build MSM Auto Collector APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find . -name settings.gradle.kts -print -quit)")
          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "Android project not found"
            exit 1
          fi
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MSM-Auto-Collector-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
